<text x="61" y="274" fill="#e1e9fa" font-family="Arial,sans-serif" font-size="24">Любопытство. Код. Следующий уровень.</text>
<rect x="61" y="308" width="157" height="31" rx="15" fill="#142e33" stroke="#2d655e"/><circle class="glow" cx="78" cy="324" r="4" fill="#62f1cc"/><text x="92" y="329" fill="#8cf6da" font-family="monospace" font-size="12" letter-spacing="1">KEEP BUILDING</text>
<text x="240" y="329" fill="#8193b0" font-family="monospace" font-size="12" letter-spacing="2">IDEA → CODE → EXPERIENCE</text>
