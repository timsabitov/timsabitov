<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Анимированный терминал Темирлана: превращать идеи в работающие проекты">
<defs><linearGradient id="bg"><stop stop-color="#091725"/><stop offset="1" stop-color="#17162d"/></linearGradient><linearGradient id="line"><stop stop-color="#62ecd5"/><stop offset="1" stop-color="#ab8bfa"/></linearGradient><clipPath id="typing"><rect width="0" height="30" y="77"><animate attributeName="width" values="0;0;150;150;150;150;0" keyTimes="0;.04;.16;.8;.9;.99;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="mission"><rect width="0" height="30" y="184"><animate attributeName="width" values="0;0;290;290;0" keyTimes="0;.32;.5;.99;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><style>
@keyframes reveal{0%,18%{opacity:0}22%,98%{opacity:1}100%{opacity:0}}
@keyframes answer{0%,52%{opacity:0}57%,98%{opacity:1}100%{opacity:0}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
.identity{animation:reveal 16s infinite}.answer{animation:answer 16s infinite}.cursor{animation:blink 1.2s infinite}
@media(prefers-reduced-motion:reduce){.identity,.answer,.cursor{animation:none}text{clip-path:none}}
</style></defs>
<rect x="1" y="1" width="1198" height="328" rx="18" fill="url(#bg)" stroke="#304056"/>
<path d="M1 54H1199" stroke="#304056"/><circle cx="29" cy="28" r="6" fill="#ab8bfa"/><circle cx="51" cy="28" r="6" fill="#536880"/><circle cx="73" cy="28" r="6" fill="#62ecd5"/>
<text x="103" y="34" fill="#99acc7" font-family="monospace" font-size="15">timsabitov@workshop:~</text><text x="1040" y="33" fill="#62ecd5" font-family="monospace" font-size="12" letter-spacing="2">TERMINAL</text>
<g font-family="monospace" font-size="23"><text x="32" y="101" fill="#62ecd5" clip-path="url(#typing)">$ whoami</text>
<text class="identity" x="32" y="145" fill="#e5eefa">Темирлан <tspan fill="#ab8bfa">/ @timsabitov</tspan></text>
<text x="32" y="208" fill="#62ecd5" clip-path="url(#mission)">$ cat mission.txt</text>
<text class="answer" x="32" y="251" fill="#dce7f7">Превращать идеи в работающие проекты.</text>
<text x="32" y="299" fill="#62ecd5">$ <tspan class="cursor">▌</tspan></text></g>
<path d="M924 85v215" stroke="#334158" opacity=".6"/><text x="961" y="111" fill="#8297b3" font-family="monospace" font-size="12" letter-spacing="2">LOADOUT</text>
<g font-family="monospace" font-size="17"><text x="961" y="154" fill="#62ecd5">01  Python</text><text x="961" y="196" fill="#ab8bfa">02  Java</text><text x="961" y="238" fill="#b5c5dc">03  HTML</text></g>
<path d="M20 328H1180" stroke="url(#line)" stroke-width="2"/></svg>