name: Neon contribution snake
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/neon-snake.yml"]
permissions:
  contents: write
concurrency:
  group: neon-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate neon snake from contribution graph
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: timsabitov
          outputs: |
            assets/neon-snake.svg?color_snake=%2362ecd5&color_dots=%23121b2e,%23283d51,%23476879,%237d72bf,%23ad8bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish refreshed animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neon-snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh neon contribution snake [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
